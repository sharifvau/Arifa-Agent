name: Build ARIFA AI APKs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Build Google Play Debug APK
      run: ./gradlew assemblePlayDebug

    - name: Build Direct Edition Debug APK
      run: ./gradlew assembleDirectDebug

    - name: Upload Play APK
      uses: actions/upload-artifact@v4
      with:
        name: ArifaAI-Play-Debug
        path: app/build/outputs/apk/play/debug/app-play-debug.apk

    - name: Upload Direct APK
      uses: actions/upload-artifact@v4
      with:
        name: ArifaAI-Direct-Debug
        path: app/build/outputs/apk/direct/debug/app-direct-debug.apk
